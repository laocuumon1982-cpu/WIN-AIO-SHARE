<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoiMac — Kiểm tra Mac cũ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: thợ kỹ thuật tận tâm — rõ ràng, chắc chắn, không màu mè
   IDEA: phiếu kiểm máy của tiệm sửa Mac, đi từng bước, đánh dấu Đạt / Lỗi
   PICTURE: công cụ đang chạy — chọn máy bằng hình vẽ máy, bàn phím ảo sáng phím, trackpad phủ ô
   COLOUR and TYPE: nhôm bạc + mực than, một màu xanh Apple làm điểm nhấn; Be Vietnam Pro
   LAYOUT: thanh bước dính trên cùng, một cột nội dung rộng 1100px, thẻ trắng trên nền nhôm */
:root{color-scheme:light dark;--bg:light-dark(#eeeeea,#121315);--card:light-dark(#fff,#1c1e21);--ink:light-dark(#17181a,#ececee);--mute:light-dark(#5f636a,#9ca0a8);--line:light-dark(#d9d9d2,#2d3034);--acc:light-dark(#0a62f0,#5b95ff);--accbg:light-dark(#e6efff,#1a2742);--ok:light-dark(#18864b,#45c47f);--okbg:light-dark(#e3f4ea,#16301f);--bad:light-dark(#c8281c,#ff6b5e);--badbg:light-dark(#fbe7e5,#3a1a17);--warn:light-dark(#9a5b00,#f0b453);--warnbg:light-dark(#fdf1dc,#33270f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}
.steps{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.steps a{flex:none;text-decoration:none;color:var(--mute);padding:8px 12px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.steps a b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;margin-right:6px}
.steps a.on{background:var(--ink);color:var(--bg)}.steps a.on b{background:var(--bg);color:var(--ink)}
main{max-width:1100px;margin:auto;padding:24px 16px 60px}
h1{font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:8px 0 10px;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:24px;line-height:1.2;margin:0 0 6px}
h3{font-size:17px;margin:0 0 4px}
.lead{color:var(--mute);max-width:66ch;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.machine{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px 12px 14px;text-align:center;min-height:44px}
.machine svg{width:100%;height:84px;display:block;margin-bottom:8px}
.machine.on{border-color:var(--acc);background:var(--accbg)}
.machine span{font-weight:600}
.gens{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:15px;min-height:44px}
.chip.on{border-color:var(--acc);background:var(--accbg);color:var(--acc);font-weight:600}
.detect{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--accbg);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:16px;padding:16px 18px;margin-bottom:22px}
.detect p{margin:0;flex:1 1 320px}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.warns{margin-top:18px;display:grid;gap:10px}
.warn{background:var(--warnbg);border-radius:12px;padding:12px 14px;color:var(--ink)}
.warn strong{color:var(--warn)}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .t{flex:1 1 300px}.row .t small{display:block;color:var(--mute);font-size:14px}
.tri{display:flex;gap:6px;flex:none}
.tri button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px;font-weight:500}
.tri button.ok.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tri button.bad.on{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tri button.skip.on{background:var(--line)}
.sec{margin-top:22px}.sec>h3{margin-bottom:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.cmd:first-child{border-top:0}
.cmd pre{margin:6px 0 0;background:var(--bg);border-radius:10px;padding:10px 12px;font:14px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto;grid-column:1/-1}
.cmd p{margin:0;color:var(--mute);font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;min-height:44px;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button i{font-style:normal;margin-left:6px}
.kb{display:grid;gap:6px;background:light-dark(#2a2c30,#0b0c0d);padding:12px;border-radius:14px;user-select:none;overflow-x:auto}
.kr{display:flex;gap:6px;min-width:640px}
.k{flex:1 1 0;height:42px;border-radius:7px;background:light-dark(#3d4046,#202226);color:#d8dade;font-size:12px;display:grid;place-items:center;transition:background .15s}
.k.down{background:var(--acc);color:#fff}.k.done{background:light-dark(#2f7a52,#1f5f3d);color:#fff}
.k.fn{height:30px}
.tp{position:relative;height:340px;border-radius:16px;background:light-dark(#dcdcd6,#26282c);overflow:hidden;touch-action:none;cursor:crosshair}
.tp canvas{position:absolute;inset:0;width:100%;height:100%}
.tp .hint{position:absolute;inset:auto 0 12px;text-align:center;color:var(--mute);font-size:14px;pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pill{border-radius:999px;padding:6px 12px;font-size:14px;background:var(--line);color:var(--mute)}
.pill.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.spk{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.spk button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px;min-height:72px}
.spk button.on{border-color:var(--acc);background:var(--accbg)}
.spk small{display:block;color:var(--mute);font-size:13px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 4px}.meter i{display:block;height:100%;background:var(--ok);transition:width .3s}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-size:clamp(48px,9vw,84px);font-weight:700;line-height:1;letter-spacing:-.03em}
.verdict{font-size:20px;font-weight:600}
.fails li{margin:6px 0}.fails b{color:var(--bad)}
#ov{position:fixed;inset:0;z-index:99;display:none;cursor:none}
#ov.show{display:block}
#ov p{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;transition:opacity .6s;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
footer{max-width:1100px;margin:auto;padding:0 16px 40px;color:var(--mute);font-size:14px}
.muted{color:var(--mute)}
@media(max-width:600px){.card{padding:16px}.tri button{padding:8px 10px}.tp{height:260px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header><div class="bar">

function detect(){

  const isMac=/Mac/.test(navigator.platform||navigator.userAgent);
  const w=Math.round(screen.width*devicePixelRatio),h=Math.round(screen.height*devicePixelRatio);
  const R={'2560x1600':['air','MacBook Air / Pro 13"'],'2560x1664':['air','MacBook Air 13.6" (M2 trở lên)'],'2880x1864':['air','MacBook Air 15"'],'3024x1964':['pro','MacBook Pro 14"'],'3456x2234':['pro','MacBook Pro 16"'],'2880x1800':['pro','MacBook Pro 15" Retina'],'3072x1920':['pro','MacBook Pro 16" 2019'],'4480x2520':['imac','iMac 24"'],'5120x2880':['imac','iMac 27" 5K'],'4096x2304':['imac','iMac 21.5" 4K'],'1440x900':['air','MacBook Air 13" (không Retina)']};
  const m=R[w+'x'+h];

}

/* trackpad logic */
let tp=null;
function tpInit(){
  const box=$('#tp');if(!box)return;const cv=$('#tpc'),ctx=cv.getContext('2d');
  tp={cells:new Set(),zones:new Set(),right:false,sy:false,sx:false,force:false,last:null};
  const GX=10,GY=6;
  const size=()=>{const r=box.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)};
  const tpRO=new ResizeObserver(size);tpRO.observe(box);
  const pos=e=>{const r=box.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,r.width,r.height]};
  box.addEventListener('pointermove',e=>{const[x,y,w,h]=pos(e);const ci=Math.min(GX-1,Math.floor(x/w*GX)),cj=Math.min(GY-1,Math.floor(y/h*GY));
    if(!tp.cells.has(ci+','+cj)){tp.cells.add(ci+','+cj);ctx.fillStyle='rgba(40,170,100,.28)';ctx.fillRect(ci*w/GX,cj*h/GY,w/GX,h/GY)}
    if(tp.last){ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--acc');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...tp.last);ctx.lineTo(x,y);ctx.stroke()}
    tp.last=[x,y];tpPills()});
  box.addEventListener('pointerleave',()=>tp.last=null);
  box.addEventListener('click',e=>{const[x,y,w,h]=pos(e);const cx=x/w,cy=y/h;let z='';
    if(cx<.25&&cy<.33)z='tl';else if(cx>.75&&cy<.33)z='tr';else if(cx<.25&&cy>.67)z='bl';else if(cx>.75&&cy>.67)z='br';else if(cx>.35&&cx<.65&&cy>.3&&cy<.7)z='c';
    if(z){tp.zones.add(z);ctx.fillStyle='rgba(10,98,240,.5)';ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill()}tpPills()});
  box.addEventListener('contextmenu',e=>{e.preventDefault();tp.right=true;tpPills()});
  box.addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)>2)tp.sy=true;if(Math.abs(e.deltaX)>2)tp.sx=true;tpPills()},{passive:false});
  box.addEventListener('webkitmouseforcedown',()=>{tp.force=true;tpPills()});
  tpPills();
}
function tpPills(){if(!tp)return;const cov=Math.round(tp.cells.size/60*100);
  const P=[[cov>=90,`Phủ vùng rê: ${cov}%`],[tp.zones.size===5,`Click góc + giữa: ${tp.zones.size}/5`],[tp.right,'Click 2 ngón'],[tp.sy,'Cuộn dọc'],[tp.sx,'Cuộn ngang'],[tp.force,'Force Click (Safari)']];
  $('#tpp').innerHTML=P.map(([ok,t])=>`<span class="pill${ok?' ok':''}">${ok?'✓ ':''}${t}</span>`).join('');
  if(P.slice(0,5).every(p=>p[0])&&!S.res.t_trackpad){S.res.t_trackpad='ok';save();toast('Trackpad đạt tất cả bài test');render()}}

/* audio */
let ac=null,nodes=[];
function stopSnd(){nodes.forEach(n=>{try{n.stop()}catch(e){}});nodes=[];document.querySelectorAll('[data-snd]').forEach(b=>b.classList.remove('on'))}
function play(id,btn){
  stopSnd();try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){toast('Trình duyệt không phát được âm thanh');return}
  const o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner?ac.createStereoPanner():null,t=ac.currentTime;
  let dur=3;o.type='sine';o.frequency.value=440;
  if(id==='bass'){o.frequency.value=60;dur=4}
  if(id==='sweep'){dur=8;o.frequency.setValueAtTime(20,t);o.frequency.exponentialRampToValueAtTime(16000,t+dur)}
  if(p)p.pan.value=id==='l'?-1:id==='r'?1:0;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.05);g.gain.setValueAtTime(.35,t+dur-.1);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);(p?g.connect(p).connect(ac.destination):g.connect(ac.destination));o.start(t);o.stop(t+dur);nodes=[o];
  btn.classList.add('on');o.onended=()=>btn.classList.remove('on');
}

  const crit=bad.filter(([i])=>i==='c_icloud'||i==='c_mdm');
  const pct=Math.round(ok/items.length*100);
  const verdict=crit.length?'Không nên mua: máy còn dính iCloud hoặc MDM.':bad.length>2?'Cân nhắc kỹ: máy có nhiều lỗi, nên ép giá hoặc bỏ qua.':bad.length?'Có lỗi nhỏ — dùng các lỗi này để thương lượng giá.':todo?'Chưa kiểm xong — còn mục chưa đánh dấu.':'Máy đạt mọi mục kiểm tra.';
  return `<h1>Kết quả kiểm tra</h1><p class="lead">${esc(line().name)} · ${esc(gen().name)}</p>
  <div class="card score"><div><div class="big" style="color:${crit.length||bad.length>2?'var(--bad)':bad.length?'var(--warn)':'var(--ok)'}">${pct}%</div><div class="muted">${ok}/${items.length} mục đạt · ${bad.length} lỗi · ${todo} chưa kiểm</div></div><div class="verdict" style="flex:1 1 260px">${verdict}</div></div>
  ${bad.length?`<div class="card sec"><h3>Các mục lỗi</h3><ul class="fails">${bad.map(([,t])=>`<li><b>✕</b> ${t}</li>`).join('')}</ul></div>`:''}
  ${todo?`<div class="card sec"><h3>Chưa kiểm</h3><p class="muted" style="margin:0">${items.filter(([i])=>!S.res[i]).map(([,t])=>t).join(' · ')}</p></div>`:''}
  <div class="nav"><button class="btn ghost" id="reset">Kiểm máy khác</button><button class="btn" id="copyrep">Sao chép báo cáo</button></div>`;
}
function report(){const items=[...checksFor().map(([id,t])=>['c_'+id,t]),['c_diag','Apple Diagnostics'],...testsFor().map(([id,n])=>['t_'+id,'Test '+n]),['t_mic','Test micro']];
  const L={ok:'Đạt',bad:'LỖI',skip:'Bỏ qua'};return `Báo cáo SoiMac — ${line().name} ${gen().name}\n`+items.map(([i,t])=>`- ${t}: ${L[S.res[i]]||'Chưa kiểm'}`).join('\n')}

/* ---------- render & events ---------- */
const V={may:vMay,ngoai:vNgoai,lenh:vLenh,test:vTest,ketqua:vKetqua};
function cur(){const h=location.hash.slice(1);return V[h]?h:'may'}
function render(){const v=cur();
  $('#steps').innerHTML=VIEWS.map(([id,n],i)=>`<a href="#${id}" class="${id===v?'on':''}"><b>${i+1}</b>${n}</a>`).join('');
  $('#app').innerHTML=V[v]();
  if(v==='test'&&S.tab==='trackpad')tpInit();else tp=null;
}
addEventListener('hashchange',()=>{stopSnd();render();scrollTo(0,0)});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.line){S.line=d.line;if(!line().gens.find(g=>g.id===S.gen))S.gen=null;save();render()}
  else if(d.gen){S.gen=d.gen;save();render()}
  else if(d.set){S.res[d.set]=S.res[d.set]===d.v?undefined:d.v;save();b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',S.res[d.set]===x.dataset.v));if(d.set.startsWith('t_')&&cur()==='test'){const t=document.querySelector(`[data-tab="${d.set.slice(2)}"] i`);if(t)t.textContent=S.res[d.set]==='ok'?'✓':S.res[d.set]==='bad'?'✕':''}}
  else if(d.tab){stopSnd();S.tab=d.tab;save();render()}
  else if(d.copy!==undefined){navigator.clipboard?.writeText(CMDS[d.copy][1]).then(()=>toast('Đã sao chép lệnh'),()=>toast('Không sao chép được — hãy bôi đen để copy'))}
  else if(d.snd)play(d.snd,b);
  else if(b.id==='sstop')stopSnd();
  else if(b.id==='scr')ovOpen();
  else if(b.id==='apply'){const x=detect();S.line=x.model[0];S.gen=suggestGen(S.line,x.chip);save();render()}
  else if(b.id==='kbr'){S.kb=[];save();render()}
  else if(b.id==='tpr'){render()}
  else if(b.id==='reset'){S={line:null,gen:null,res:{},tab:'screen',kb:[]};save();location.hash='may';render()}
  else if(b.id==='copyrep'){navigator.clipboard?.writeText(report()).then(()=>toast('Đã sao chép báo cáo'),()=>toast('Không sao chép được'))}
});
document.addEventListener('keydown',e=>{
  if(ov.classList.contains('show')){e.preventDefault();if(e.key==='Escape')ovClose();else if(e.key==='ArrowLeft')ovShow(ci-1);else ovShow(ci+1);return}
  const kb=$('#kb');if(!kb||document.activeElement?.id==='kbt')return;
  if(!e.metaKey)e.preventDefault();
  const k=kb.querySelector(`[data-k="${e.code}"]`);if(!k)return;
  k.classList.add('down');
  if(!S.kb.includes(e.code)){S.kb.push(e.code);save();k.classList.add('done');$('#kbm').style.width=Math.round(S.kb.length/KCOUNT*100)+'%';$('#kbc').textContent=`${S.kb.length}/${KCOUNT} phím`;
    if(S.kb.length===KCOUNT){toast('Đã nhận đủ mọi phím');if(!S.res.t_keyboard){S.res.t_keyboard='ok';save();render()}}}
});
document.addEventListener('keyup',e=>{const k=document.querySelector(`#kb [data-k="${e.code}"]`);if(k)k.classList.remove('down');if(e.code.startsWith('Meta'))document.querySelectorAll('#kb .down').forEach(x=>x.classList.remove('down'))});
render();
}
</script>
</body>
</html>
