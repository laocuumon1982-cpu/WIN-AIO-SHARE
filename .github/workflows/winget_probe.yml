name: Kiem tra ID winget
on:
  push:
    branches: [main]
    paths: ["tools/winget_probe.ps1", ".github/workflows/winget_probe.yml"]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/winget_probe.ps1
